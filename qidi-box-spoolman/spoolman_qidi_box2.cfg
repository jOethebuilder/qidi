#####################################################################
# spoolman_qidi_box2.cfg
#
# Purpose: QIDI Box slot-based Spoolman tracking
# NOTE: T4-T7 macros check ALL 8 slots (both boxes), since QIDI can
# dynamically map any tool to any physical slot across both boxes.
######################################################################

[gcode_macro BOX2_SLOT1]
variable_spool_id: None
gcode:

[gcode_macro BOX2_SLOT2]
variable_spool_id: None
gcode:

[gcode_macro BOX2_SLOT3]
variable_spool_id: None
gcode:

[gcode_macro BOX2_SLOT4]
variable_spool_id: None
gcode:

[gcode_macro RESTORE_TOOL_SPOOLS_BOX2]
description: Restore Box2 SLOT selectors (BOX2_SLOT1..4) from Fluidd-saved variables
gcode:
  {% set svv = printer.save_variables.variables %}
  {% for m in ['BOX2_SLOT1','BOX2_SLOT2','BOX2_SLOT3','BOX2_SLOT4'] %}
    {% set key = (m + '__SPOOL_ID')|lower %}
    {% set sid = svv[key]|default(0)|int %}
    {% if sid > 0 %}
      SET_GCODE_VARIABLE MACRO={m} VARIABLE=spool_id VALUE={sid}
    {% else %}
      SET_GCODE_VARIABLE MACRO={m} VARIABLE=spool_id VALUE=None
    {% endif %}
  {% endfor %}
  RESPOND TYPE=echo MSG="Restored Box2 slot->spool mapping (BOX2_SLOT1..4)."

[delayed_gcode RESTORE_SELECTED_SPOOLS_BOX2]
initial_duration: 1
gcode:
  RESTORE_TOOL_SPOOLS_BOX2

[gcode_macro REPORT_BOX2_TOOL_SLOT_MAP]
gcode:
  {% set sv = printer.save_variables.variables %}
  RESPOND TYPE=echo MSG="Tool->slot: T4={sv.value_t4|default('unset')}, T5={sv.value_t5|default('unset')}, T6={sv.value_t6|default('unset')}, T7={sv.value_t7|default('unset')}"

[gcode_macro CHEATSHEET_BOX2]
gcode:
  {% set sv = printer.save_variables.variables %}
  RESPOND TYPE=echo MSG="Slot1(raw slot4) spool_id={printer['gcode_macro BOX2_SLOT1'].spool_id|default(0)|int}"
  RESPOND TYPE=echo MSG="Slot2(raw slot5) spool_id={printer['gcode_macro BOX2_SLOT2'].spool_id|default(0)|int}"
  RESPOND TYPE=echo MSG="Slot3(raw slot6) spool_id={printer['gcode_macro BOX2_SLOT3'].spool_id|default(0)|int}"
  RESPOND TYPE=echo MSG="Slot4(raw slot7) spool_id={printer['gcode_macro BOX2_SLOT4'].spool_id|default(0)|int}"
  RESPOND TYPE=echo MSG="Tool->slot now: T4={sv.value_t4|default('unset')}, T5={sv.value_t5|default('unset')}, T6={sv.value_t6|default('unset')}, T7={sv.value_t7|default('unset')}"

# T4-T7: check ALL 8 physical slots (both boxes), since a tool can be
# dynamically mapped to any slot, not just slot4-7.
[gcode_macro T4]
gcode:
  {% set slot = printer.save_variables.variables.value_t4|default('slot4') %}
  {% if slot == 'slot0' %}{% set sid = printer['gcode_macro BOX1_SLOT1'].spool_id %}
  {% elif slot == 'slot1' %}{% set sid = printer['gcode_macro BOX1_SLOT2'].spool_id %}
  {% elif slot == 'slot2' %}{% set sid = printer['gcode_macro BOX1_SLOT3'].spool_id %}
  {% elif slot == 'slot3' %}{% set sid = printer['gcode_macro BOX1_SLOT4'].spool_id %}
  {% elif slot == 'slot4' %}{% set sid = printer['gcode_macro BOX2_SLOT1'].spool_id %}
  {% elif slot == 'slot5' %}{% set sid = printer['gcode_macro BOX2_SLOT2'].spool_id %}
  {% elif slot == 'slot6' %}{% set sid = printer['gcode_macro BOX2_SLOT3'].spool_id %}
  {% elif slot == 'slot7' %}{% set sid = printer['gcode_macro BOX2_SLOT4'].spool_id %}
  {% else %}{% set sid = None %}
  {% endif %}

  {% if sid is not none and sid|int > 0 %}
    SET_ACTIVE_SPOOL ID={sid|int}
  {% else %}
    CLEAR_ACTIVE_SPOOL
  {% endif %}

  {% if slot in ['slot0','slot1','slot2','slot3','slot4','slot5','slot6','slot7'] and printer.save_variables.variables.enable_box == 1 %}
    EXTRUDER_LOAD SLOT={slot}
  {% endif %}

